name: Build MeowFlare Lite IPA and AltStore Source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'source.json'
      - 'README.md'
permissions:
  contents: write
concurrency:
  group: jcc-cloud-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Xcode
        run: xcodebuild -version
      - name: Configure fork identifiers and open-source features
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path('apps/ios/Orange Cloud/Orange Cloud.xcodeproj/project.pbxproj')
          s = p.read_text()
          s = s.replace('DEVELOPMENT_TEAM = 6G78MMY657;', 'DEVELOPMENT_TEAM = "";')
          s = re.sub(r'CURRENT_PROJECT_VERSION = [0-9]+;', 'CURRENT_PROJECT_VERSION = ' + os.environ['GITHUB_RUN_NUMBER'] + ';', s)
          p.write_text(s)
          # Keep the main app's groups consistent with this fork; no extensions are built.
          for ent in Path('apps/ios/Orange Cloud/Orange Cloud').glob('*.entitlements'):
              s = ent.read_text().replace('group.jiamin.chen.Orange-Cloud', 'group.com.jccmon.jcccloud')
              s = s.replace('group.jiamin.chen.orange-cloud', 'group.com.jccmon.jcccloud')
              s = s.replace('jiamin.chen.orange-cloud.shared', 'com.jccmon.jcccloud.shared')
              ent.write_text(s)
          PY
      - name: Validate project and OAuth permission behavior
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint "apps/ios/Orange Cloud/Orange Cloud.xcodeproj/project.pbxproj"
          xcodebuild -list -project "apps/ios/Orange Cloud/Orange Cloud.xcodeproj"
          bash scripts/test_oauth_permissions.sh
      - name: Build unsigned iPhone application only
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project "apps/ios/Orange Cloud/Orange Cloud.xcodeproj" \
            -scheme "Orange Cloud" -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='OPENSOURCE_UNLOCKED' \
            build
      - name: Package and validate release Lite IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Orange Cloud.app" Payload/
          # Defensive stripping if Xcode ever reintroduces optional embedded targets.
          rm -rf "Payload/Orange Cloud.app/Watch" "Payload/Orange Cloud.app/PlugIns"
          /usr/bin/zip -qry MeowFlare-Lite.ipa Payload
          python3 scripts/validate_lite_ipa.py MeowFlare-Lite.ipa > "$RUNNER_TEMP/ipa-info.json"
      - name: Upload validated Lite IPA
        uses: actions/upload-artifact@v4
        with:
          name: MeowFlare-Lite
          path: MeowFlare-Lite.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Publish Lite IPA and update AltStore feed
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="jcc-cloud-${RUN_NUMBER}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" MeowFlare-Lite.ipa --clobber --repo "$REPO"
          else
            gh release create "$TAG" MeowFlare-Lite.ipa --target "$COMMIT_SHA" \
              --title "MeowFlare build ${RUN_NUMBER}" \
              --notes "iPhone-only Lite IPA from ${COMMIT_SHA}. No Watch or app extensions. Sign using AltStore. Upstream: chen2he/orange-cloud." --latest
          fi
          # Read the current feed after the build, then use its SHA as a write lease.
          gh api "repos/$REPO/contents/source.json?ref=main" > "$RUNNER_TEMP/source-current.json"
          python3 - <<'PY'
          import base64, datetime, json, os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          info = json.loads((temp / 'ipa-info.json').read_text())
          current = json.loads((temp / 'source-current.json').read_text())
          feed = json.loads(base64.b64decode(current['content']))
          app = next(a for a in feed['apps'] if a['bundleIdentifier'] == 'com.jccmon.jcccloud')
          version = str(info['CFBundleShortVersionString'])
          build = str(info['CFBundleVersion'])
          run = os.environ['RUN_NUMBER']
          assert build == run, f'IPA build {build} does not match run {run}'
          repo = os.environ['REPO']
          url = f'https://github.com/{repo}/releases/download/jcc-cloud-{run}/MeowFlare-Lite.ipa'
          now = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z')
          size = Path('MeowFlare-Lite.ipa').stat().st_size
          entry = dict(version=version, buildVersion=build, date=now, size=size, downloadURL=url,
                       minOSVersion=info['MinimumOSVersion'], localizedDescription=f'Lite build from {os.environ["COMMIT_SHA"][:12]}')
          # Historical Full builds remain on GitHub, but must not be offered as Lite in AltStore.
          history = [v for v in app.get('versions', [])
                     if v.get('downloadURL', '').endswith('/MeowFlare-Lite.ipa')
                     and (v.get('version'), v.get('buildVersion')) != (version, build)]
          app.update(name='MeowFlare', developerName='MeowFlare (self-build)', version=version,
                     buildVersion=build, versionDate=now, size=size, downloadURL=url,
                     versions=[entry] + history[:19])
          feed.update(name='MeowFlare Builds', sourceURL=f'https://raw.githubusercontent.com/{repo}/main/source.json')
          content = json.dumps(feed, ensure_ascii=False, indent=2) + '\n'
          request = dict(message=f'ci: publish MeowFlare Lite build {run} to AltStore',
                         content=base64.b64encode(content.encode()).decode(), sha=current['sha'], branch='main')
          (temp / 'source-update.json').write_text(json.dumps(request))
          PY
          gh api --method PUT "repos/$REPO/contents/source.json" --input "$RUNNER_TEMP/source-update.json" --silent
